services:
  # ── PostgreSQL Database ──────────────────────────────────
  # Optional: skip this service if using an external PostgreSQL.
  # Just point PG_HOST in your .env to the external host.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-college_2}
      POSTGRES_USER: ${PG_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Set PG_ADMIN_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-postgres} -d ${PG_DB:-college_2}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Text-to-SQL Application ─────────────────────────────
  # FastAPI on port 8000 + Streamlit on port 8501
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override PG_HOST to point to the Docker postgres service
      PG_HOST: db
      # Streamlit connects to FastAPI inside the same container
      API_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"    # FastAPI API + Swagger docs
      - "8501:8501"    # Streamlit UI
      - "3000:3000"    # React UI
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  chroma_data:
    driver: local
